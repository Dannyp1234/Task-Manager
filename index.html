<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1016; --surface:#161923; --surface2:#1e2230; --surface3:#262b3d; --border:#2b3040;
    --text:#eceef4; --text-dim:#9096ab; --text-faint:#5c6278;

    --title:#22223A;
    --today:#3AA6D9;      --today-bg:rgba(58,166,217,0.14);
    --capture:#D9A400;    --capture-bg:rgba(217,164,0,0.14);
    --quickwin:#4CAF50;   --quickwin-bg:rgba(76,175,80,0.14);
    --urgent:#E8734A;     --urgent-bg:rgba(232,115,74,0.14);
    --tasks:#5B6FE0;      --tasks-bg:rgba(91,111,224,0.14);
    --parked:#F0A93E;     --parked-bg:rgba(240,169,62,0.14);
    --recurring:#2FB6A8;  --recurring-bg:rgba(47,182,168,0.14);
    --projects:#8E5BD9;   --projects-bg:rgba(142,91,217,0.14);
    --wins:#3FAE5A;       --wins-bg:rgba(63,174,90,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px;}
  button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit;}
  #app{max-width:1300px;margin:0 auto;padding:20px 20px 80px;}

  .topbar{
    background:var(--title); border-radius:16px; padding:16px 20px; margin-bottom:16px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand h1{font-size:21px;margin:0;font-weight:700;color:#fff;letter-spacing:-0.01em;}
  .brand .sub{font-size:12px;color:rgba(255,255,255,0.55); margin-top:-1px;}
  .topbar-actions{display:flex; gap:8px;}
  .btn-add{background:#fff; color:var(--title); padding:10px 18px; border-radius:10px; font-weight:700; font-size:13.5px;}
  .btn-add:hover{opacity:.9;}
  .btn-refresh{background:rgba(255,255,255,0.12); color:#fff; padding:10px 14px; border-radius:10px; font-weight:600; font-size:13px;}
  .btn-refresh:hover{background:rgba(255,255,255,0.2);}
  .btn-home{background:var(--surface2); color:var(--text); border:1px solid var(--border); padding:9px 15px; border-radius:10px; font-weight:600; font-size:13px;}
  .btn-home:hover{background:var(--surface3);}

  .ws-toggle{display:flex; background:rgba(255,255,255,0.08); border-radius:11px; padding:3px; gap:2px;}
  .ws-btn{padding:8px 16px; border-radius:8px; font-weight:700; font-size:13px; color:rgba(255,255,255,0.55);}
  .ws-btn.active{background:#fff; color:var(--title);}
  .ws-btn:hover:not(.active){color:#fff;}

  .pillrow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .pill{display:flex; align-items:baseline; gap:7px; background:var(--surface); border:1px solid var(--border); padding:8px 14px; border-radius:100px; font-size:12.5px; font-weight:600; color:var(--text-dim); transition:transform .1s ease;}
  .pill:hover{transform:translateY(-1px);}
  .pill b{font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--text);}
  .pill.c-today{border-color:rgba(58,166,217,0.45);} .pill.c-today b{color:var(--today);}
  .pill.c-capture{border-color:rgba(217,164,0,0.45);} .pill.c-capture b{color:var(--capture);}
  .pill.c-quickwin{border-color:rgba(76,175,80,0.45);} .pill.c-quickwin b{color:var(--quickwin);}
  .pill.c-urgent{border-color:rgba(232,115,74,0.45);} .pill.c-urgent b{color:var(--urgent);}
  .pill.c-parked{border-color:rgba(240,169,62,0.45);} .pill.c-parked b{color:var(--parked);}
  .pill.c-tasks{border-color:rgba(91,111,224,0.45);} .pill.c-tasks b{color:var(--tasks);}
  .pill.c-projects{border-color:rgba(142,91,217,0.45);} .pill.c-projects b{color:var(--projects);}
  .pill.c-recurring{border-color:rgba(47,182,168,0.45);} .pill.c-recurring b{color:var(--recurring);}
  .pill.c-wins{border-color:rgba(63,174,90,0.45);} .pill.c-wins b{color:var(--wins);}

  /* two-column landing, exact stacking order */
  .landing-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start;}
  @media(max-width:880px){.landing-grid{grid-template-columns:1fr;}}
  .col{display:flex; flex-direction:column; gap:16px;}

  .section{background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden;}
  .section-head{padding:12px 16px; display:flex; align-items:center; justify-content:space-between; color:#fff; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.04em;}
  .section-head .hint{font-weight:500; text-transform:none; font-size:11px; opacity:.85; letter-spacing:0;}
  .section-body{padding:10px 12px 12px;}
  .section-count{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12.5px; opacity:.9;}
  .showall{font-size:11.5px; font-weight:700; color:#fff; background:rgba(255,255,255,0.18); padding:5px 10px; border-radius:7px;}
  .showall:hover{background:rgba(255,255,255,0.3);}

  .empty{color:var(--text-faint); font-size:13px; padding:12px 6px; font-style:italic;}

  .row{border-radius:10px; margin-bottom:3px;}
  .row-main{display:flex; align-items:flex-start; gap:8px; padding:9px 6px; border-radius:10px;}
  .row-main:hover{background:var(--surface2);}
  .expand-btn{width:20px;height:20px;border-radius:6px;background:var(--surface3); color:var(--text-faint); font-size:12px; font-weight:900; flex-shrink:0; margin-top:2px; display:flex;align-items:center;justify-content:center;}
  .expand-btn:hover{color:var(--text);}
  .expand-spacer{width:20px; flex-shrink:0;}
  .row-check{width:19px;height:19px;border-radius:6px;border:2px solid var(--text-faint); flex-shrink:0; margin-top:2px; display:flex;align-items:center;justify-content:center;}
  .row-check.checked{background:var(--wins); border-color:var(--wins);}
  .row-check.checked:after{content:"✓"; color:#0e1016; font-size:12px; font-weight:900;}
  .item-reorder{display:flex; flex-direction:column; gap:2px; flex-shrink:0;}
  .row-body{flex:1; min-width:0; cursor:pointer;}
  .row-title{font-size:13.5px; font-weight:600; color:var(--text); line-height:1.3;}
  .row-title .step-of{color:var(--text-faint); font-weight:500;}
  .row-meta{display:flex; gap:6px; align-items:center; margin-top:4px; flex-wrap:wrap;}
  .tag{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:100px;}
  .tag.due{background:var(--parked-bg); color:var(--parked);}
  .tag.overdue{background:var(--urgent-bg); color:var(--urgent);}
  .tag.review{background:var(--projects-bg); color:var(--projects);}
  .tag.urgent{background:var(--urgent-bg); color:var(--urgent);}
  .tag.prio-high{background:var(--urgent-bg); color:var(--urgent);}
  .tag.prio-medium{background:var(--capture-bg); color:var(--capture);}
  .tag.prio-low{background:var(--surface3); color:var(--text-faint);}
  .progress-mini{display:flex; align-items:center; gap:6px; margin-top:4px;}
  .progress-track{flex:1; height:5px; background:var(--surface3); border-radius:3px; overflow:hidden; max-width:130px;}
  .progress-fill{height:100%; border-radius:3px;}
  .progress-label{font-size:10.5px; color:var(--text-faint); font-family:'JetBrains Mono',monospace;}

  /* nested steps, inline like Notion sub-items */
  .steps-nested{margin-left:26px; margin-top:2px; margin-bottom:6px; border-left:2px solid var(--surface3); padding-left:10px;}
  .step-nested-row{display:flex; align-items:center; gap:8px; padding:5px 4px;}
  .step-nested-text{flex:1; font-size:12.5px; color:var(--text-dim);}
  .step-nested-text.done{text-decoration:line-through; color:var(--text-faint);}
  .mini-flag{font-size:9.5px; font-weight:700; padding:3px 7px; border-radius:6px; background:var(--surface3); color:var(--text-faint);}
  .mini-flag.today.active{background:var(--today-bg); color:var(--today);}
  .mini-flag.quickwin.active{background:var(--quickwin-bg); color:var(--quickwin);}
  .step-add-inline{display:flex; gap:6px; margin-top:4px; padding-left:4px;}
  .step-add-inline input{flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:7px; padding:6px 9px; color:var(--text); font-size:12px; outline:none;}
  .step-add-inline button{background:var(--surface3); color:var(--text-dim); padding:6px 10px; border-radius:7px; font-size:11.5px; font-weight:700;}

  /* quick capture */
  .qc-input-row{display:flex; gap:8px; margin-bottom:10px;}
  .qc-input{flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 13px; color:var(--text); font-size:13.5px; outline:none;}
  .qc-input:focus{border-color:var(--capture);}
  .qc-urgent-toggle{width:42px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); color:var(--text-faint); font-size:15px; flex-shrink:0;}
  .qc-urgent-toggle.active{background:var(--urgent-bg); border-color:var(--urgent); color:var(--urgent);}
  .qc-send{background:var(--capture); color:#0e1016; font-weight:700; padding:0 16px; border-radius:10px; font-size:13px;}
  .qc-item{display:flex; align-items:center; gap:9px; padding:8px 8px; border-radius:8px;}
  .qc-item:hover{background:var(--surface2);}
  .qc-item .qc-text{flex:1; font-size:13px;}
  .qc-item.urgent .qc-text{color:var(--urgent); font-weight:600;}
  .qc-actions{display:flex; gap:5px;}
  .qc-btn{font-size:10.5px; font-weight:700; padding:5px 8px; border-radius:6px; background:var(--surface3); color:var(--text-dim);}
  .qc-btn.convert{background:var(--capture-bg); color:var(--capture);}

  .win-row{display:flex; gap:9px; padding:7px 6px; font-size:12.5px;}
  .win-row .dot{color:var(--wins); flex-shrink:0;}
  .win-parent{color:var(--text-faint); font-size:10.5px;}

  .overlay-backdrop{position:fixed; inset:0; background:rgba(6,7,11,0.72); backdrop-filter:blur(2px); display:flex; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto; z-index:50;}
  .overlay-card{background:var(--surface); border:1px solid var(--border); border-radius:18px; max-width:640px; width:100%; padding:24px 24px 28px; margin-top:10px;}
  .overlay-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .overlay-title{font-size:19px; font-weight:700;}
  .overlay-close{width:32px;height:32px;border-radius:9px;background:var(--surface2); display:flex;align-items:center;justify-content:center; font-size:15px; color:var(--text-dim);}
  .overlay-close:hover{background:var(--surface3); color:var(--text);}

  label.field-label{display:block; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); margin:14px 0 6px;}
  input[type=text],input[type=date],input[type=email],input[type=password],textarea,select{width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 13px; color:var(--text); font-size:13.5px; outline:none; font-family:inherit;}
  input:focus,textarea:focus,select:focus{border-color:var(--today);}
  textarea{resize:vertical; min-height:56px;}
  .type-choice{display:flex; gap:8px;}
  .type-btn{flex:1; padding:13px 10px; border-radius:12px; border:1px solid var(--border); background:var(--surface2); text-align:center; font-weight:700; font-size:12.5px; color:var(--text-dim);}
  .type-btn.active.task{border-color:var(--tasks); background:var(--tasks-bg); color:var(--tasks);}
  .type-btn.active.project{border-color:var(--projects); background:var(--projects-bg); color:var(--projects);}
  .type-btn.active.recurring{border-color:var(--recurring); background:var(--recurring-bg); color:var(--recurring);}
  .type-btn.active.ws{border-color:var(--text-dim); background:var(--surface3); color:var(--text);}
  .row2{display:flex; gap:12px;} .row2 > div{flex:1;}
  .row3{display:flex; gap:12px;} .row3 > div{flex:1;}
  .checkline{display:flex; align-items:center; gap:9px; margin-top:13px; font-size:13px; color:var(--text-dim); font-weight:600;}
  .checkline input{width:auto;}
  .step-list{margin-top:6px;}
  .step-row{display:flex; align-items:center; gap:9px; padding:7px 4px; border-bottom:1px solid var(--surface2);}
  .step-row:last-child{border-bottom:none;}
  .step-text{flex:1; font-size:13px;}
  .step-text.done{text-decoration:line-through; color:var(--text-faint);}
  .step-flags{display:flex; gap:5px;}
  .flag-btn{font-size:10px; font-weight:700; padding:5px 8px; border-radius:7px; background:var(--surface3); color:var(--text-faint);}
  .flag-btn.today.active{background:var(--today-bg); color:var(--today);}
  .flag-btn.quickwin.active{background:var(--quickwin-bg); color:var(--quickwin);}
  .step-add-row{display:flex; gap:8px; margin-top:9px;}
  .save-bar{display:flex; gap:10px; margin-top:20px;}
  .btn-primary{flex:1; background:var(--text); color:var(--bg); font-weight:700; padding:12px; border-radius:11px; font-size:13.5px;}
  .btn-secondary{background:var(--surface2); color:var(--text-dim); font-weight:700; padding:12px 18px; border-radius:11px; font-size:13.5px; border:1px solid var(--border);}
  .btn-danger{color:var(--urgent);}
  .detail-meta-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .detail-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px;}
  .detail-btn{font-size:12px; font-weight:700; padding:9px 13px; border-radius:9px; background:var(--surface2); border:1px solid var(--border); color:var(--text-dim);}
  .detail-btn:hover{color:var(--text);}
  .detail-btn.primary{background:var(--today-bg); color:var(--today); border-color:transparent;}
  .detail-btn.done{background:var(--wins-bg); color:var(--wins); border-color:transparent;}
  .park-box{background:var(--parked-bg); border:1px solid rgba(240,169,62,0.35); border-radius:12px; padding:11px 13px; margin-top:12px; font-size:12.5px;}
  .park-box b{color:var(--parked);}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--surface3); border:1px solid var(--border); padding:10px 18px; border-radius:10px; font-size:13px; font-weight:600; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .toast.show{opacity:1;}
  .footer-note{text-align:center; color:var(--text-faint); font-size:11px; margin-top:24px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

async function fetchAllData(){
  const [itemsRes, qcRes, histRes, stateRes] = await Promise.all([
    sb.from('items').select('*'),
    sb.from('quick_captures').select('*'),
    sb.from('history').select('*').order('date', {ascending:false}),
    sb.from('app_state').select('*').eq('user_id', currentUser.id).maybeSingle()
  ]);
  data.items = (itemsRes.data||[]).map(fromItemRow);
  data.quickCaptures = (qcRes.data||[]).map(fromQcRow);
  data.history = (histRes.data||[]).map(fromHistRow);
  const st = stateRes.data;
  data.order = (st && st.order_map) || {};
  data.currentWorkspace = (st && st.current_workspace) || 'work';
  data.expanded = {};
}
async function saveData(){
  if(!currentUser) return;
  try{
    if(data.items.length) await sb.from('items').upsert(data.items.map(toItemRow));
    if(data.quickCaptures.length) await sb.from('quick_captures').upsert(data.quickCaptures.map(toQcRow));
    if(data.history.length) await sb.from('history').upsert(data.history.map(toHistRow));
    await sb.from('app_state').upsert({ user_id: currentUser.id, order_map: data.order||{}, current_workspace: data.currentWorkspace });
  }catch(e){ console.error(e); showToast('Sync failed — check your connection'); }
}

function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return ''; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function isOverdue(item){ if(item.parked) return false; if(item.dueDate && item.dueDate < todayISO()) return true; return false; }
function isUrgentOrOverdue(item){ return !item.completed && (item.urgent || isOverdue(item)); }
function genId(type){ return type + '-' + (crypto.randomUUID?crypto.randomUUID().slice(0,8):Math.random().toString(36).slice(2,10)); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function getItem(id){ return data.items.find(i=>i.id===id); }
function progress(item){
  if(!item.steps || item.steps.length===0) return null;
  const total = item.steps.length; const done = item.steps.filter(s=>s.done).length;
  return {done, total, pct: Math.round(done/total*100)};
}
function todayCount(){
  let c=0; data.items.forEach(it=>{ if(it.workspace!==data.currentWorkspace) return; if(!it.steps || it.steps.length===0){ if(it.today) c++; } else it.steps.forEach(s=>{ if(s.today && !s.done) c++; }); }); return c;
}
function quickWinCount(){
  let c=0; data.items.forEach(it=>{ if(it.workspace!==data.currentWorkspace) return; if(!it.steps || it.steps.length===0){ if(it.quickwin) c++; } else it.steps.forEach(s=>{ if(s.quickwin && !s.done) c++; }); }); return c;
}
function weekRange(){
  const now = new Date(); const day = (now.getDay()+6)%7;
  const monday = new Date(now); monday.setDate(now.getDate()-day);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  return [monday.toISOString().slice(0,10), sunday.toISOString().slice(0,10)];
}
function addToHistory(entry){ data.history.unshift({ id: uid(), date: todayISO(), ...entry }); }

function addItem(type, fields){
  const prefix = type==='task'?'T':type==='project'?'P':'R';
  const id = genId(prefix);
  const item = Object.assign({
    id, type, name:'', notes:'', priority:'Medium', dueDate:'', reviewDate:'',
    urgent:false, parked:false, parkReason:'', parkReviewDate:'',
    recurrence: type==='recurring' ? {freq:'Weekly'} : null,
    steps: [], today:false, quickwin:false, workspace: data.currentWorkspace,
    createdDate: todayISO(), completed:false, completedDate:null
  }, fields);
  data.items.push(item); saveData(); return item;
}
function updateItem(id, fields){ const it = getItem(id); if(!it) return; Object.assign(it, fields); saveData(); }
function deleteItem(id){ data.items = data.items.filter(i=>i.id!==id); sb.from('items').delete().eq('id', id).then(()=>{}); saveData(); }
function addStep(itemId, text){
  const it = getItem(itemId); if(!it || !text.trim()) return;
  const stepNum = String(it.steps.length+1).padStart(2,'0');
  it.steps.push({ id: itemId+'-S'+stepNum, text: text.trim(), done:false, today:false, quickwin:false });
  saveData();
}
function toggleStepDone(itemId, stepId){
  const it = getItem(itemId); const step = it.steps.find(s=>s.id===stepId);
  step.done = !step.done;
  if(step.done){ step.today=false; step.quickwin=false; addToHistory({type:'step', text: step.text, parentName: it.name, workspace: it.workspace}); }
  saveData(); checkAllStepsComplete(it);
}
function checkAllStepsComplete(it){
  if(it.steps.length>0 && it.steps.every(s=>s.done) && !it.completed){
    setTimeout(()=>{ if(confirm(`All steps done for "${it.name}". Mark it complete?`)){ completeItem(it.id); render(); } }, 100);
  }
}
function toggleToday(itemId, stepId){
  const MAX = 5; const it = getItem(itemId);
  const target = stepId ? it.steps.find(s=>s.id===stepId) : it;
  if(!target.today && todayCount() >= MAX){ showToast("Today's Focus is full (5)"); return; }
  target.today = !target.today; if(target.today) target.quickwin = false; saveData();
}
function toggleQuickWin(itemId, stepId){
  const MAX = 5; const it = getItem(itemId);
  const target = stepId ? it.steps.find(s=>s.id===stepId) : it;
  if(!target.quickwin && quickWinCount() >= MAX){ showToast('Quick Wins is full (5)'); return; }
  target.quickwin = !target.quickwin; if(target.quickwin) target.today = false; saveData();
}
function completeItem(id){
  const it = getItem(id); if(!it) return;
  it.completed = true; it.completedDate = todayISO(); it.today=false; it.quickwin=false;
  addToHistory({type: it.type, text: it.name, parentName: null, workspace: it.workspace});
  if(it.type==='recurring') rollRecurring(it);
  saveData();
}
function rollRecurring(it){
  const freq = it.recurrence.freq; let base = it.dueDate ? new Date(it.dueDate+'T00:00:00') : new Date();
  if(freq==='Weekly') base.setDate(base.getDate()+7);
  else if(freq==='Monthly') base.setMonth(base.getMonth()+1);
  else if(freq==='Quarterly') base.setMonth(base.getMonth()+3);
  it.dueDate = base.toISOString().slice(0,10); it.completed = false; it.completedDate = null;
  it.steps.forEach(s=>{ s.done=false; s.today=false; s.quickwin=false; });
}
function parkItem(id, reason, reviewDate){ updateItem(id, {parked:true, parkReason:reason, parkReviewDate:reviewDate}); }
function unparkItem(id){ updateItem(id, {parked:false, parkReason:'', parkReviewDate:''}); }

  if(!text.trim()) return;
  data.quickCaptures.unshift({ id: uid(), text: text.trim(), urgent: !!urgent, createdDate: todayISO(), resolved:false, workspace: data.currentWorkspace });
  saveData();
}
function completeQuickCapture(id){ const qc = data.quickCaptures.find(q=>q.id===id); qc.resolved = true; addToHistory({type:'capture', text: qc.text, parentName:null, workspace: qc.workspace}); saveData(); }
function moveStep(itemId, stepId, dir){
  const it = getItem(itemId); if(!it) return;
  const idx = it.steps.findIndex(s=>s.id===stepId);
  const newIdx = idx + dir;
  if(newIdx<0 || newIdx>=it.steps.length) return;
  const tmp = it.steps[idx]; it.steps[idx] = it.steps[newIdx]; it.steps[newIdx] = tmp;
  saveData();
}

function getCategoryItems(category){
  const ws = i => i.workspace===data.currentWorkspace;
  if(category==='tasks') return data.items.filter(i=>i.type==='task' && !i.completed && !i.parked && ws(i));
  if(category==='projects') return data.items.filter(i=>i.type==='project' && !i.completed && !i.parked && ws(i));
  if(category==='recurring') return data.items.filter(i=>i.type==='recurring' && !i.completed && ws(i));
  if(category==='parked') return data.items.filter(i=>i.parked && !i.completed && ws(i));
  return [];
}
function orderedList(category, items){
  if(!data.order) data.order = {};
  if(!data.order[category]) data.order[category] = [];
  const ids = items.map(i=>i.id);
  ids.forEach(id=>{ if(!data.order[category].includes(id)) data.order[category].push(id); });
  const orderIds = data.order[category].filter(id=>ids.includes(id));
  return orderIds.map(id=>items.find(i=>i.id===id));
}
function moveItemInCategory(category, id, dir){
  const items = getCategoryItems(category);
  const visibleIds = orderedList(category, items).map(i=>i.id);
  const idx = visibleIds.indexOf(id);
  const newIdx = idx + dir;
  if(idx<0 || newIdx<0 || newIdx>=visibleIds.length) return;
  const tmp = visibleIds[idx]; visibleIds[idx] = visibleIds[newIdx]; visibleIds[newIdx] = tmp;
  data.order[category] = visibleIds;
  saveData();
}

function sortPreview(list){
  return [...list].sort((a,b)=>{
    const ao = isUrgentOrOverdue(a) ? 0 : 1, bo = isUrgentOrOverdue(b) ? 0 : 1;
    if(ao!==bo) return ao-bo;
    const ad = a.dueDate || a.reviewDate || a.parkReviewDate || '9999';
    const bd = b.dueDate || b.reviewDate || b.parkReviewDate || '9999';
    if(ad!==bd) return ad<bd? -1:1;
    const ap = progress(a)?.pct ?? -1, bp = progress(b)?.pct ?? -1;
    if(ap!==bp) return bp-ap;
    return (a.createdDate||'') < (b.createdDate||'') ? -1 : 1;
  });
}
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
function prioTag(p){ if(!p) return ''; return `<span class="tag prio-${p.toLowerCase()}">${p}</span>`; }

function render(){
  if(!loaded) return;
  const app = document.getElementById('app');
  if(view.page === 'landing'){ app.innerHTML = renderLanding(); attachLandingEvents(); }
  else if(view.page === 'detail'){ app.innerHTML = renderDetailOverlay(view.id); attachOverlayEvents(); }
  else if(view.page === 'add'){ app.innerHTML = renderAddOverlay(); attachOverlayEvents(); }
  else if(view.page === 'list'){ app.innerHTML = renderListOverlay(view.category); attachOverlayEvents(); }
}

function nestedSteps(item){
  if(!item.steps || item.steps.length===0) return '';
  return `<div class="steps-nested">
    ${item.steps.map((s,idx)=>`
      <div class="step-nested-row">
        <button class="row-check ${s.done?'checked':''}" style="width:16px;height:16px;" data-toggle-done="${item.id}|${s.id}"></button>
        <div class="step-nested-text ${s.done?'done':''}">${escapeHtml(s.text)}</div>
        <button class="mini-flag today ${s.today?'active':''}" data-toggle-today="${item.id}|${s.id}">Today</button>
        <button class="mini-flag quickwin ${s.quickwin?'active':''}" data-toggle-qw="${item.id}|${s.id}">QW</button>
        <button class="mini-flag" data-move-step="${item.id}|${s.id}|-1" ${idx===0?'disabled style="opacity:.3;"':''}>↑</button>
        <button class="mini-flag" data-move-step="${item.id}|${s.id}|1" ${idx===item.steps.length-1?'disabled style="opacity:.3;"':''}>↓</button>
      </div>`).join('')}

}

function itemRow(item, colorKey, opts){
  opts = opts || {};
  const prog = progress(item);
  const overdue = isOverdue(item);
  const hasSteps = item.steps && item.steps.length>0;
  const expanded = !!data.expanded[item.id];
  let tags = prioTag(item.priority);
  if(item.urgent) tags += `<span class="tag urgent">Urgent</span>`;
  if(overdue) tags += `<span class="tag overdue">Overdue ${fmtDate(item.dueDate)}</span>`;
  else if(item.dueDate) tags += `<span class="tag due">Due ${fmtDate(item.dueDate)}</span>`;
  if(item.reviewDate) tags += `<span class="tag review">Review ${fmtDate(item.reviewDate)}</span>`;
  let progHtml = prog ? `<div class="progress-mini">
      <div class="progress-track"><div class="progress-fill" style="width:${prog.pct}%; background:var(--${colorKey})"></div></div>
      <div class="progress-label">${prog.done}/${prog.total} · ${prog.pct}%</div>
    </div>` : '';
  const reorderHtml = opts.reorder ? `<div class="item-reorder">
      <button class="mini-flag" data-move-item="${opts.category}|${item.id}|-1" ${opts.idx===0?'disabled style="opacity:.3;"':''}>↑</button>
      <button class="mini-flag" data-move-item="${opts.category}|${item.id}|1" ${opts.idx===opts.total-1?'disabled style="opacity:.3;"':''}>↓</button>
    </div>` : '';
  return `<div class="row">
    <div class="row-main">
      ${hasSteps ? `<button class="expand-btn" data-toggle-expand="${item.id}">${expanded?'−':'+'}</button>` : `<span class="expand-spacer"></span>`}
      <div class="row-body" data-open="${item.id}">
        <div class="row-title">${escapeHtml(item.name)}</div>
        <div class="row-meta">${tags}</div>
        ${progHtml}
      </div>
      ${reorderHtml}
    </div>
    ${hasSteps && expanded ? nestedSteps(item) : ''}
  </div>`;
}

function sectionQuickCapture(list){

function sectionItemList(title, colorKey, list, category){

    </div>`).join('') : `<div class="empty">Nothing completed yet.</div>`;

}
function section(title, colorKey, hintHtml, countText, bodyHtml){
  return `<div class="section">
    <div class="section-head" style="background:var(--${colorKey})">
      <div>${title.toUpperCase()} ${hintHtml}</div>
      <div class="section-count">${countText}</div>

}

function attachLandingEvents(){
  document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', ()=>{ view = {page:'detail', id: el.dataset.open}; render(); }));
  document.querySelectorAll('[data-list]').forEach(el=>el.addEventListener('click', ()=>{ view = {page:'list', category: el.dataset.list}; render(); }));
  document.querySelectorAll('[data-scroll]').forEach(el=>el.addEventListener('click', ()=>{ document.getElementById(el.dataset.scroll)?.scrollIntoView({behavior:'smooth', block:'center'}); }));
  document.querySelectorAll('[data-toggle-expand]').forEach(el=>el.addEventListener('click', (e)=>{ e.stopPropagation(); toggleExpand(el.dataset.toggleExpand); }));
  document.querySelectorAll('[data-complete-step]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation(); const [itemId, stepId] = el.dataset.completeStep.split('|');
    if(stepId) toggleStepDone(itemId, stepId); else completeItem(itemId); render();
  }));
  document.querySelectorAll('[data-toggle-done]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation(); const [itemId, stepId] = el.dataset.toggleDone.split('|'); toggleStepDone(itemId, stepId); render();
  }));
  document.querySelectorAll('[data-toggle-today]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation(); const [itemId, stepId] = el.dataset.toggleToday.split('|'); toggleToday(itemId, stepId||null); render();
  }));
  document.querySelectorAll('[data-toggle-qw]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation(); const [itemId, stepId] = el.dataset.toggleQw.split('|'); toggleQuickWin(itemId, stepId||null); render();
  }));
  document.querySelectorAll('[data-move-step]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation(); const [itemId, stepId, dir] = el.dataset.moveStep.split('|'); moveStep(itemId, stepId, parseInt(dir,10)); render();
  }));
  document.querySelectorAll('[data-move-item]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation(); const [category, id, dir] = el.dataset.moveItem.split('|'); moveItemInCategory(category, id, parseInt(dir,10)); render();
  }));
  document.querySelectorAll('[data-inline-step-add]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation(); const id = el.dataset.inlineStepAdd; const inp = document.querySelector(`[data-inline-step-input="${id}"]`);
    if(inp.value.trim()){ addStep(id, inp.value); render(); }
  }));
  document.querySelectorAll('[data-inline-step-input]').forEach(el=>el.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ e.stopPropagation(); const id = el.dataset.inlineStepInput; if(el.value.trim()){ addStep(id, el.value); render(); } }
  }));
  document.querySelectorAll('[data-complete-capture]').forEach(el=>el.addEventListener('click', ()=>{ completeQuickCapture(el.dataset.completeCapture); render(); }));
  document.querySelectorAll('[data-convert-capture]').forEach(el=>el.addEventListener('click', ()=>{
    const qc = data.quickCaptures.find(q=>q.id===el.dataset.convertCapture); qc.resolved = true; saveData();
    view = {page:'add', itemType:'task', itemWorkspace: qc.workspace, prefill:{name: qc.text, urgent: qc.urgent}}; render();
  }));
  const addBtn = document.getElementById('qc-send'), input = document.getElementById('qc-text-input'), urgentToggle = document.getElementById('qc-urgent-toggle');
  let urgentOn = false;
  if(urgentToggle) urgentToggle.addEventListener('click', ()=>{ urgentOn=!urgentOn; urgentToggle.classList.toggle('active', urgentOn); });
  function doAdd(){ if(!input.value.trim()) return; addQuickCapture(input.value, urgentOn); input.value=''; urgentOn=false; render(); }
  if(addBtn) addBtn.addEventListener('click', doAdd);
  if(input) input.addEventListener('keydown', e=>{ if(e.key==='Enter') doAdd(); });
  document.querySelector('[data-action="open-add"]')?.addEventListener('click', ()=>{ view = {page:'add', itemType:null, itemWorkspace: data.currentWorkspace}; render(); });
  document.getElementById('refresh-btn')?.addEventListener('click', async ()=>{ await fetchAllData(); render(); showToast('Synced from server'); });
  document.getElementById('sync-btn')?.addEventListener('click', async ()=>{ if(confirm('Sign out of Task Tracker?')){ await sb.auth.signOut(); location.reload(); } });
  document.querySelectorAll('[data-workspace]').forEach(el=>el.addEventListener('click', ()=>{
    data.currentWorkspace = el.dataset.workspace; saveData(); render();
  }));
}

function attachOverlayEvents(){
  const backdrop = document.getElementById('backdrop');
  const close = ()=>{ view = {page:'landing'}; pendingSteps=[]; render(); };
  document.getElementById('close-overlay')?.addEventListener('click', close);
  backdrop?.addEventListener('click', (e)=>{ if(e.target===backdrop) close(); });
  document.getElementById('go-home')?.addEventListener('click', close);
  document.querySelectorAll('[data-pick-type]').forEach(el=>el.addEventListener('click', ()=>{ view.itemType = el.dataset.pickType; render(); }));
  document.querySelectorAll('[data-pick-ws]').forEach(el=>el.addEventListener('click', ()=>{ view.itemWorkspace = el.dataset.pickWs; render(); }));
  document.getElementById('cancel-item-btn')?.addEventListener('click', close);
  document.getElementById('add-step-btn')?.addEventListener('click', ()=>{
    const inp = document.getElementById('new-step-input'); if(!inp.value.trim()) return;
    if(view.editId){ addStep(view.editId, inp.value); render(); }
    else { pendingSteps.push(inp.value.trim()); inp.value='';
      const list = document.getElementById('step-list');
      list.innerHTML = pendingSteps.map(s=>`<div class="step-row"><div class="step-text">${escapeHtml(s)}</div></div>`).join('') || `<div class="empty" style="padding:4px 2px;">No steps yet.</div>`;
    }
  });
  document.getElementById('save-item-btn')?.addEventListener('click', ()=>{
    const name = document.getElementById('f-name').value.trim();
    if(!name){ showToast('Give it a name first'); return; }
    const newType = view.itemType;
    const fields = {
      name, notes: document.getElementById('f-notes').value,
      priority: document.getElementById('f-priority').value,
      dueDate: document.getElementById('f-due').value, reviewDate: document.getElementById('f-review').value,
      urgent: document.getElementById('f-urgent').checked,
      workspace: view.itemWorkspace || data.currentWorkspace,
    };
    const freqEl = document.getElementById('f-freq');
    fields.recurrence = newType==='recurring' ? {freq: freqEl ? freqEl.value : 'Weekly'} : null;

    if(view.editId){
      const existing = getItem(view.editId);
      if(newType !== existing.type){
        const prefix = newType==='task'?'T':newType==='project'?'P':'R';
        const newId = genId(prefix);
        const newSteps = existing.steps.map((s,idx)=>Object.assign({}, s, {id:newId+'-S'+String(idx+1).padStart(2,'0')}));
        const newItem = Object.assign({}, existing, fields, {id:newId, type:newType, steps:newSteps});
        const idx = data.items.findIndex(i=>i.id===existing.id);
        data.items.splice(idx,1,newItem);
        delete data.expanded[existing.id];
        saveData();
        view = {page:'detail', id:newId}; render();
        showToast(`Changed to ${newType} — now ${newId}`);
      } else {
        updateItem(view.editId, fields); view = {page:'detail', id: view.editId}; render();
      }
    } else {
      const it = addItem(newType, fields); pendingSteps.forEach(s=>addStep(it.id, s)); pendingSteps = []; saveData(); view = {page:'detail', id: it.id}; render();
    }
  });
  document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', ()=>{ view = {page:'detail', id: el.dataset.open}; render(); }));
  document.querySelectorAll('[data-toggle-today]').forEach(el=>el.addEventListener('click', ()=>{ const [itemId, stepId] = el.dataset.toggleToday.split('|'); toggleToday(itemId, stepId||null); render(); }));
  document.querySelectorAll('[data-toggle-qw]').forEach(el=>el.addEventListener('click', ()=>{ const [itemId, stepId] = el.dataset.toggleQw.split('|'); toggleQuickWin(itemId, stepId||null); render(); }));
  document.querySelectorAll('[data-toggle-done]').forEach(el=>el.addEventListener('click', ()=>{ const [itemId, stepId] = el.dataset.toggleDone.split('|'); toggleStepDone(itemId, stepId); render(); }));
  document.querySelectorAll('[data-move-step]').forEach(el=>el.addEventListener('click', ()=>{ const [itemId, stepId, dir] = el.dataset.moveStep.split('|'); moveStep(itemId, stepId, parseInt(dir,10)); render(); }));
  document.querySelectorAll('[data-move-item]').forEach(el=>el.addEventListener('click', ()=>{ const [category, id, dir] = el.dataset.moveItem.split('|'); moveItemInCategory(category, id, parseInt(dir,10)); render(); }));
  document.getElementById('add-step-detail-btn')?.addEventListener('click', ()=>{ const inp = document.getElementById('detail-step-input'); if(inp.value.trim()){ addStep(view.id, inp.value); render(); } });
  document.getElementById('detail-step-input')?.addEventListener('keydown', e=>{ if(e.key==='Enter'){ addStep(view.id, e.target.value); render(); } });
  document.getElementById('mark-complete-btn')?.addEventListener('click', ()=>{ completeItem(view.id); view={page:'landing'}; render(); });
  document.getElementById('edit-item-btn')?.addEventListener('click', ()=>{ const it = getItem(view.id); view = {page:'add', itemType: it.type, itemWorkspace: it.workspace, editId: view.id}; render(); });
  document.getElementById('delete-item-btn')?.addEventListener('click', ()=>{ if(confirm('Delete this permanently?')){ deleteItem(view.id); view={page:'landing'}; render(); } });
  document.getElementById('park-btn')?.addEventListener('click', ()=>{
    const reason = prompt('Why is this parked / waiting?'); if(reason===null) return;
    const rdate = prompt('Review date (YYYY-MM-DD)?', todayISO()); if(rdate===null) return;
    parkItem(view.id, reason, rdate); render();
  });
  document.getElementById('unpark-btn')?.addEventListener('click', ()=>{ unparkItem(view.id); render(); });
  document.querySelectorAll('[data-complete-capture]').forEach(el=>el.addEventListener('click', ()=>{ completeQuickCapture(el.dataset.completeCapture); render(); }));
  document.querySelectorAll('[data-convert-capture]').forEach(el=>el.addEventListener('click', ()=>{
    const qc = data.quickCaptures.find(q=>q.id===el.dataset.convertCapture); qc.resolved = true; saveData();
    view = {page:'add', itemType:'task', itemWorkspace: qc.workspace, prefill:{name: qc.text, urgent: qc.urgent}}; render();
  }));
}

function renderDetailOverlay(id){
  const it = getItem(id);
  if(!it) return `<div class="overlay-backdrop"><div class="overlay-card">Not found. <button class="btn-secondary" id="go-home">Home</button></div></div>`;
  const prog = progress(it); const colorKey = it.type==='task'?'tasks':it.type==='project'?'projects':'recurring';
  let stepsHtml = it.steps && it.steps.length ? it.steps.map((s,idx)=>`
      <div class="step-row">
        <button class="row-check ${s.done?'checked':''}" data-toggle-done="${it.id}|${s.id}"></button>
        <div class="step-text ${s.done?'done':''}">${escapeHtml(s.text)}</div>
        <div class="step-flags">
          <button class="flag-btn today ${s.today?'active':''}" data-toggle-today="${it.id}|${s.id}">Today</button>
          <button class="flag-btn quickwin ${s.quickwin?'active':''}" data-toggle-qw="${it.id}|${s.id}">Quick Win</button>
          <button class="flag-btn" data-move-step="${it.id}|${s.id}|-1" ${idx===0?'disabled style="opacity:.3;"':''}>↑</button>
          <button class="flag-btn" data-move-step="${it.id}|${s.id}|1" ${idx===it.steps.length-1?'disabled style="opacity:.3;"':''}>↓</button>
        </div>
      </div>`).join('') : `<div class="empty">No steps — this item can be selected directly for Today or Quick Wins below.</div>`;
  const itemLevelFlags = (!it.steps || it.steps.length===0) ? `<div class="detail-actions">
      <button class="detail-btn primary ${it.today?'active':''}" data-toggle-today="${it.id}|">${it.today?'✓ In Today':'Add to Today'}</button>
      <button class="detail-btn ${it.quickwin?'active':''}" data-toggle-qw="${it.id}|">${it.quickwin?'✓ Quick Win':'Mark Quick Win'}</button>
    </div>` : '';
  const parkedBox = it.parked ? `<div class="park-box"><b>Parked / Waiting</b> — ${escapeHtml(it.parkReason||'')}<br/>Review ${fmtDate(it.parkReviewDate)||'—'} ${it.dueDate?` · Due ${fmtDate(it.dueDate)}`:''}</div>` : '';
  return `<div class="overlay-backdrop" id="backdrop"><div class="overlay-card">
    <div class="overlay-top">
      <div><span class="tag" style="background:var(--${colorKey}-bg); color:var(--${colorKey}); text-transform:capitalize;">${it.type}</span>
        <span class="tag" style="background:var(--surface3); color:var(--text-faint);">${it.workspace==='personal'?'🏠 Personal':'💼 Work'}</span>
        <div class="overlay-title" style="margin-top:8px;">${escapeHtml(it.name)}</div></div>
      <button class="overlay-close" id="close-overlay">✕</button>
    </div>
    <div class="detail-meta-row">
      ${prioTag(it.priority)}
      ${it.urgent?`<span class="tag urgent">Urgent</span>`:''}
      ${isOverdue(it)?`<span class="tag overdue">Overdue ${fmtDate(it.dueDate)}</span>`: it.dueDate?`<span class="tag due">Due ${fmtDate(it.dueDate)}</span>`:''}
      ${it.reviewDate?`<span class="tag review">Review ${fmtDate(it.reviewDate)}</span>`:''}
      ${it.recurrence?`<span class="tag" style="background:var(--surface3); color:var(--text-faint);">${it.recurrence.freq}</span>`:''}
    </div>
    ${prog ? `<div class="progress-mini" style="margin-bottom:10px;">
      <div class="progress-track" style="max-width:220px;"><div class="progress-fill" style="width:${prog.pct}%; background:var(--${colorKey})"></div></div>
      <div class="progress-label">${prog.done} of ${prog.total} complete · ${prog.pct}%</div></div>` : ''}
    ${it.notes ? `<div style="font-size:13px; color:var(--text-dim); margin-bottom:6px;">${escapeHtml(it.notes)}</div>` : ''}
    ${parkedBox}
    <label class="field-label" style="margin-top:16px;">Steps</label>
    <div class="step-list">${stepsHtml}</div>
    <div class="step-add-row"><input type="text" id="detail-step-input" placeholder="Add a step…" /><button class="btn-secondary" id="add-step-detail-btn" style="padding:10px 16px;">Add</button></div>
    ${itemLevelFlags}
    <div class="detail-actions">
      ${!it.completed ? `<button class="detail-btn done" id="mark-complete-btn">Mark complete</button>`:''}
      <button class="detail-btn" id="edit-item-btn">Edit</button>
      ${it.parked ? `<button class="detail-btn" id="unpark-btn">Resume (unpark)</button>` : `<button class="detail-btn" id="park-btn">Park / Waiting</button>`}
      <button class="detail-btn btn-danger" id="delete-item-btn">Delete</button>
    </div>
  </div></div>`;
}

function renderListOverlay(category){
  let title, list, colorKey, reorderable = false;
  if(category==='tasks'){ title='All Tasks'; list=getCategoryItems('tasks'); colorKey='tasks'; reorderable=true; }
  else if(category==='projects'){ title='All Projects'; list=getCategoryItems('projects'); colorKey='projects'; reorderable=true; }
  else if(category==='parked'){ title='Parked / Waiting'; list=getCategoryItems('parked'); colorKey='parked'; reorderable=true; }
  else if(category==='recurring'){ title='Recurring Tasks'; list=getCategoryItems('recurring'); colorKey='recurring'; reorderable=true; }
  else if(category==='urgent'){ title='Urgent / Overdue'; list=data.items.filter(i=>!i.completed && isUrgentOrOverdue(i) && i.workspace===data.currentWorkspace); colorKey='urgent'; }
  else if(category==='captures'){
    title='Quick Capture';
    const rows = data.quickCaptures.filter(q=>!q.resolved && q.workspace===data.currentWorkspace).map(qc=>`
      <div class="qc-item ${qc.urgent?'urgent':''}"><div class="qc-text">${escapeHtml(qc.text)}</div>
        <div class="qc-actions"><button class="qc-btn convert" data-convert-capture="${qc.id}">Convert</button><button class="qc-btn" data-complete-capture="${qc.id}">Done</button></div>
      </div>`).join('') || `<div class="empty">Inbox empty.</div>`;
    return listShell(title, rows);
  }
  const full = reorderable ? orderedList(category, list) : sortPreview(list||[]);
  const rows = full.length ? full.map((it,idx)=>itemRow(it,colorKey, reorderable ? {reorder:true, category, idx, total:full.length} : {})).join('') : `<div class="empty">Nothing here.</div>`;
  return listShell(title, rows);
}
function listShell(title, rowsHtml){
  return `<div class="overlay-backdrop" id="backdrop"><div class="overlay-card">
    <div class="overlay-top"><div class="overlay-title">${title}</div><button class="overlay-close" id="close-overlay">✕</button></div>
    ${rowsHtml}
  </div></div>`;
}

document.addEventListener('click', (e)=>{
  const exp = e.target.closest('[data-toggle-expand]');
  if(exp){ e.stopPropagation(); }
});

boot();
</script>
